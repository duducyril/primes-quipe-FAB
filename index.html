<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primes Quip - Bonuses</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .member-card { border: 1px solid #ccc; padding: 20px; margin: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Bonuses for Team Members</h1>
    <div id="members"></div>
    <script>
        const members = [{ name: 'Alice', bonuses: [] }, { name: 'Bob', bonuses: [] }, { name: 'Charlie', bonuses: [] }];

        function renderMembers() {
            const membersContainer = document.getElementById('members');
            membersContainer.innerHTML = '';
            members.forEach(member => {
                const card = document.createElement('div');
                card.className = 'member-card';
                card.innerHTML = `<h2>${member.name}</h2>`;
                const bonusHistory = document.createElement('div');
                bonusHistory.innerHTML = '<h3>Bonus History</h3>' + member.bonuses.map(b => `<p>$${b.amount} - ${b.comment}</p>`).join('');
                card.appendChild(bonusHistory);
                const commentInput = document.createElement('input');
                commentInput.placeholder = 'Add a comment';
                commentInput.id = `${member.name.replace(' ', '_')}_comment`;
                const bonusInput = document.createElement('input');
                bonusInput.placeholder = 'Add bonus amount';
                const addButton = document.createElement('button');
                addButton.innerText = 'Add Bonus';
                addButton.onclick = () => addBonus(member);
                card.appendChild(bonusInput);
                card.appendChild(commentInput);
                card.appendChild(addButton);
                membersContainer.appendChild(card);
            });
        }

        function addBonus(member) {
            const bonusInput = document.getElementById(`${member.name.replace(' ', '_')}_comment`);
            const amount = parseFloat(bonusInput.value);
            const comment = document.getElementById(`${member.name.replace(' ', '_')}_comment`).value;
            if (!isNaN(amount) && comment) {
                member.bonuses.push({ amount, comment });
                localStorage.setItem('bonuses', JSON.stringify(members));
                renderMembers();
            } else {
                alert('Please enter a valid amount and comment.');
            }
        }

        function loadBonuses() {
            const storedBonuses = JSON.parse(localStorage.getItem('bonuses')) || [];
            storedBonuses.forEach((storedMember, index) => {
                if (members[index]) {
                    members[index].bonuses = storedMember.bonuses;
                }
            });
            renderMembers();
        }

        window.onload = loadBonuses;
    </script>
</body>
</html>
