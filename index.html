<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Primes Équipe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }
        .card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .modal { animation: modalPop 0.3s ease; }
        @keyframes modalPop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen pb-20">
    <div class="max-w-lg mx-auto">

        <!-- HEADER -->
        <div class="bg-zinc-900 border-b border-zinc-800 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-emerald-500 rounded-2xl flex items-center justify-center text-xl">💰</div>
                <div>
                    <h1 class="text-2xl font-semibold">Primes Équipe</h1>
                    <p id="team-count" class="text-zinc-400 text-sm">0 membre(s)</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="showHistory()" 
                        class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-3xl text-sm font-medium flex items-center gap-1">
                    📋 Historique
                </button>
                <button onclick="showSettings()" 
                        class="w-9 h-9 bg-zinc-800 hover:bg-zinc-700 rounded-2xl flex items-center justify-center text-xl">
                    ⚙️
                </button>
            </div>
        </div>

        <!-- TOTALS GLOBAUX -->
        <div class="px-6 py-5 bg-gradient-to-r from-emerald-600 to-teal-600 mx-4 mt-4 rounded-3xl shadow-xl">
            <div class="flex justify-between items-center">
                <div>
                    <p class="text-emerald-100 text-sm font-medium">MOIS EN COURS</p>
                    <p id="global-month" class="text-4xl font-semibold text-white">0 €</p>
                </div>
                <div class="text-right">
                    <p class="text-emerald-100 text-sm font-medium">TOTAL ANNUEL</p>
                    <p id="global-year" class="text-4xl font-semibold text-white">0 €</p>
                </div>
                <div class="text-6xl opacity-20">📅</div>
            </div>
            <p id="current-month-name" class="text-emerald-100 text-xs mt-1">Avril 2026</p>
        </div>

        <!-- LISTE DES MEMBRES -->
        <div class="px-4 pt-6">
            <div class="flex justify-between items-center mb-4 px-2">
                <h2 class="text-lg font-semibold">Mon équipe</h2>
                <button onclick="showAddMemberModal()" 
                        class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-500 px-5 h-10 rounded-3xl text-sm font-medium">
                    <span class="text-xl leading-none">+</span> 
                    Ajouter un membre
                </button>
            </div>

            <div id="members-list" class="space-y-3">
                <!-- Les cartes seront injectées ici par JS -->
            </div>
        </div>

        <!-- FOOTER NAV -->
        <div class="fixed bottom-0 left-0 right-0 max-w-lg mx-auto bg-zinc-900 border-t border-zinc-800 px-6 py-3 flex items-center justify-around text-xs font-medium z-50">
            <button onclick="navigate(0)" class="flex flex-col items-center text-emerald-400">
                👥<br>Équipe
            </button>
            <button onclick="navigate(1)" class="flex flex-col items-center text-zinc-400">
                📊<br>Rapport
            </button>
            <button onclick="navigate(2)" class="flex flex-col items-center text-zinc-400">
                💸<br>Ajouter prime
            </button>
        </div>
    </div>

    <!-- MODAL AJOUT MEMBRE -->
    <div id="add-member-modal" onclick="if(event.target===this)hideModal()" 
         class="hidden fixed inset-0 bg-black/70 flex items-end z-[100]">
        <div class="modal bg-zinc-900 w-full rounded-t-3xl p-6 max-w-lg mx-auto">
            <h3 class="text-xl font-semibold mb-6">Ajouter un membre</h3>
            <input id="new-member-name" 
                   type="text" 
                   placeholder="Nom du membre (ex: Julien Dupont)"
                   class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4 text-lg focus:outline-none focus:border-emerald-500">
            <div class="flex gap-3 mt-8">
                <button onclick="hideModal()" 
                        class="flex-1 py-4 text-zinc-400 font-medium">Annuler</button>
                <button onclick="addNewMember()" 
                        class="flex-1 bg-emerald-600 hover:bg-emerald-500 py-4 rounded-3xl font-semibold">Ajouter</button>
            </div>
        </div>
    </div>

    <!-- MODAL DETAIL MEMBRE -->
    <div id="member-detail-modal" onclick="if(event.target===this)hideModal()" 
         class="hidden fixed inset-0 bg-black/70 flex items-end z-[100]">
        <div class="modal bg-zinc-900 w-full rounded-t-3xl max-h-[85vh] overflow-hidden max-w-lg mx-auto flex flex-col">
            <div class="p-6 border-b border-zinc-800 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div id="detail-avatar" class="w-10 h-10 bg-emerald-500 rounded-2xl flex items-center justify-center text-2xl"></div>
                    <div>
                        <h3 id="detail-name" class="text-2xl font-semibold"></h3>
                        <p id="detail-id" class="text-zinc-400 text-sm"></p>
                    </div>
                </div>
                <button onclick="hideModal()" class="text-3xl leading-none text-zinc-400">×</button>
            </div>

            <div class="p-6 flex-1 overflow-auto">
                <!-- Infos rapides -->
                <div class="grid grid-cols-2 gap-4 mb-8">
                    <div class="bg-zinc-800 rounded-3xl p-4">
                        <p class="text-xs text-zinc-400">MOIS EN COURS</p>
                        <p id="detail-month-total" class="text-4xl font-semibold text-emerald-400">0 €</p>
                    </div>
                    <div class="bg-zinc-800 rounded-3xl p-4">
                        <p class="text-xs text-zinc-400">TOTAL ANNUEL</p>
                        <p id="detail-year-total" class="text-4xl font-semibold text-emerald-400">0 €</p>
                    </div>
                </div>

                <!-- Boutons primes rapides -->
                <div class="flex gap-4 mb-8">
                    <button onclick="quickAddPrime(20)" 
                            class="flex-1 bg-emerald-600 hover:bg-emerald-500 rounded-3xl py-6 text-center">
                        <div class="text-2xl font-bold">+20 €</div>
                        <div class="text-sm text-emerald-100">Prime 1</div>
                    </button>
                    <button onclick="quickAddPrime(60)" 
                            class="flex-1 bg-amber-600 hover:bg-amber-500 rounded-3xl py-6 text-center">
                        <div class="text-2xl font-bold">+60 €</div>
                        <div class="text-sm text-amber-100">Prime 2</div>
                    </button>
                </div>

                <!-- Historique du membre -->
                <h4 class="font-medium mb-3 flex items-center gap-2">
                    <span>Historique des primes</span>
                    <span id="history-count" class="text-xs bg-zinc-700 px-2 py-0.5 rounded-full"></span>
                </h4>
                <div id="member-history-list" class="space-y-2 max-h-96 overflow-auto">
                    <!-- Injecté par JS -->
                </div>
            </div>

            <!-- Footer du modal -->
            <div class="p-4 border-t border-zinc-800 flex gap-3">
                <button onclick="renameCurrentMember()" 
                        class="flex-1 py-4 border border-zinc-700 rounded-3xl text-sm font-medium">✏️ Renommer</button>
                <button onclick="deleteCurrentMember()" 
                        class="flex-1 py-4 bg-red-600/10 text-red-400 hover:bg-red-600/20 rounded-3xl text-sm font-medium">🗑️ Supprimer</button>
            </div>
        </div>
    </div>

    <!-- MODAL HISTORIQUE GLOBAL -->
    <div id="history-modal" onclick="if(event.target===this)hideModal()" 
         class="hidden fixed inset-0 bg-black/70 flex items-end z-[100]">
        <div class="modal bg-zinc-900 w-full rounded-t-3xl max-h-[90vh] max-w-lg mx-auto flex flex-col">
            <div class="p-6 border-b flex justify-between">
                <h3 class="text-2xl font-semibold">Historique complet</h3>
                <button onclick="hideModal()" class="text-3xl">×</button>
            </div>
            <div class="flex-1 overflow-auto p-6" id="global-history-content">
                <!-- Injecté par JS -->
            </div>
            <div class="p-4 border-t flex gap-3 text-sm">
                <button onclick="exportToCSV()" 
                        class="flex-1 py-4 bg-emerald-600 rounded-3xl font-medium">📤 Exporter CSV</button>
                <button onclick="clearAllData()" 
                        class="flex-1 py-4 bg-red-600/10 text-red-400 rounded-3xl font-medium">🗑️ Tout effacer</button>
            </div>
        </div>
    </div>

    <!-- MODAL PARAMÈTRES -->
    <div id="settings-modal" onclick="if(event.target===this)hideModal()" 
         class="hidden fixed inset-0 bg-black/70 flex items-end z-[100]">
        <div class="modal bg-zinc-900 w-full rounded-t-3xl p-6 max-w-lg mx-auto">
            <h3 class="text-xl font-semibold mb-6">Paramètres</h3>
            <div class="space-y-4">
                <div onclick="clearAllData()" class="flex items-center justify-between p-5 bg-zinc-800 rounded-3xl cursor-pointer">
                    <div class="flex items-center gap-4">
                        <span class="text-2xl">🗑️</span>
                        <div>
                            <p class="font-medium">Effacer toutes les données</p>
                            <p class="text-xs text-red-400">Action irréversible</p>
                        </div>
                    </div>
                </div>
                <a href="https://github.com" target="_blank" class="block p-5 bg-zinc-800 rounded-3xl text-center text-sm font-medium">
                    Version 1.0 • Créé pour toi par Grok
                </a>
            </div>
            <button onclick="hideModal()" class="mt-8 w-full py-4 text-zinc-400">Fermer</button>
        </div>
    </div>

    <script>
        let members = []
        let bonuses = []
        let currentMemberId = null

        function loadData() {
            const savedMembers = localStorage.getItem('primesMembers')
            const savedBonuses = localStorage.getItem('primesBonuses')
            if (savedMembers) members = JSON.parse(savedMembers)
            if (savedBonuses) bonuses = JSON.parse(savedBonuses)

            if (members.length === 0) {
                members = [
                    { id: 'm1', name: 'Membre 1' },
                    { id: 'm2', name: 'Membre 2' },
                    { id: 'm3', name: 'Membre 3' },
                    { id: 'm4', name: 'Membre 4' }
                ]
                saveData()
            }
        }

        function saveData() {
            localStorage.setItem('primesMembers', JSON.stringify(members))
            localStorage.setItem('primesBonuses', JSON.stringify(bonuses))
        }

        function getCurrentMonthYear() {
            const now = new Date()
            return {
                year: now.getFullYear(),
                month: now.getMonth() + 1,
                monthName: now.toLocaleString('fr-FR', { month: 'long', year: 'numeric' })
            }
        }

        function isCurrentMonth(dateStr) {
            const d = new Date(dateStr)
            const current = getCurrentMonthYear()
            return d.getFullYear() === current.year && d.getMonth() + 1 === current.month
        }

        function isCurrentYear(dateStr) {
            const d = new Date(dateStr)
            return d.getFullYear() === getCurrentMonthYear().year
        }

        function getMemberMonthTotal(memberId) {
            return bonuses
                .filter(b => b.memberId === memberId && isCurrentMonth(b.date))
                .reduce((sum, b) => sum + b.amount, 0)
        }

        function getMemberYearTotal(memberId) {
            return bonuses
                .filter(b => b.memberId === memberId && isCurrentYear(b.date))
                .reduce((sum, b) => sum + b.amount, 0)
        }

        function getGlobalMonthTotal() {
            return members.reduce((sum, m) => sum + getMemberMonthTotal(m.id), 0)
        }

        function getGlobalYearTotal() {
            return members.reduce((sum, m) => sum + getMemberYearTotal(m.id), 0)
        }

        function renderMembersList() {
            const container = document.getElementById('members-list')
            container.innerHTML = ''
            document.getElementById('team-count').textContent = `${members.length} membre${members.length > 1 ? 's' : ''}`
            const current = getCurrentMonthYear()

            members.forEach(member => {
                const monthTotal = getMemberMonthTotal(member.id)
                const yearTotal = getMemberYearTotal(member.id)

                const cardHTML = `
                <div onclick="openMemberDetail('${member.id}')" 
                     class="card bg-zinc-900 border border-zinc-800 hover:border-emerald-500 rounded-3xl p-5 flex items-center justify-between cursor-pointer">
                    <div class="flex items-center gap-4">
                        <div class="w-11 h-11 bg-gradient-to-br from-emerald-400 to-teal-400 rounded-2xl flex items-center justify-center text-3xl shadow-inner">👤</div>
                        <div>
                            <p class="font-semibold text-lg">${member.name}</p>
                            <p class="text-xs text-zinc-400">${current.monthName}</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="flex items-baseline gap-1 justify-end">
                            <span class="text-emerald-400 text-3xl font-semibold">${monthTotal}</span>
                            <span class="text-emerald-400 text-sm">€</span>
                        </div>
                        <p class="text-[10px] text-zinc-500">mois</p>
                        <div class="mt-3 flex items-baseline gap-1 justify-end">
                            <span class="font-medium text-zinc-300">${yearTotal}</span>
                            <span class="text-xs text-zinc-400">€ annuel</span>
                        </div>
                    </div>
                    <div class="flex flex-col gap-2 ml-6">
                        <button onclick="event.stopImmediatePropagation(); addPrime('${member.id}', 20)" 
                                class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-4 py-1 rounded-2xl font-medium">+20 €</button>
                        <button onclick="event.stopImmediatePropagation(); addPrime('${member.id}', 60)" 
                                class="bg-amber-600 hover:bg-amber-500 text-white text-xs px-4 py-1 rounded-2xl font-medium">+60 €</button>
                    </div>
                </div>`

                container.innerHTML += cardHTML
            })

            document.getElementById('global-month').textContent = getGlobalMonthTotal() + ' €'
            document.getElementById('global-year').textContent = getGlobalYearTotal() + ' €'
            document.getElementById('current-month-name').textContent = current.monthName
        }

        function addPrime(memberId, amount) {
            const now = new Date().toISOString().split('T')[0]
            bonuses.unshift({
                id: 'b-' + Date.now(),
                memberId: memberId,
                amount: amount,
                date: now
            })
            saveData()
            renderMembersList()
            const toast = document.createElement('div')
            toast.style.cssText = 'position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:#10b981; color:white; padding:12px 24px; border-radius:9999px; font-weight:600; box-shadow:0 10px 15px -3px rgb(16 185 129); z-index:9999;'
            toast.textContent = `+${amount} € ajouté !`
            document.body.appendChild(toast)
            setTimeout(() => toast.remove(), 1800)
        }

        function quickAddPrime(amount) {
            if (currentMemberId) {
                addPrime(currentMemberId, amount)
                renderMemberDetail(currentMemberId)
            }
        }

        function openMemberDetail(id) {
            currentMemberId = id
            const member = members.find(m => m.id === id)
            if (!member) return
            document.getElementById('detail-name').textContent = member.name
            document.getElementById('detail-id').textContent = `ID: ${id}`
            document.getElementById('detail-avatar').innerHTML = '👤'
            renderMemberDetail(id)
            document.getElementById('member-detail-modal').classList.remove('hidden')
            document.getElementById('member-detail-modal').classList.add('flex')
        }

        function renderMemberDetail(id) {
            const member = members.find(m => m.id === id)
            if (!member) return
            document.getElementById('detail-month-total').innerHTML = `${getMemberMonthTotal(id)} <span class="text-2xl">€</span>`
            document.getElementById('detail-year-total').innerHTML = `${getMemberYearTotal(id)} <span class="text-2xl">€</span>`
            const filtered = bonuses
                .filter(b => b.memberId === id)
                .sort((a, b) => new Date(b.date) - new Date(a.date))
            document.getElementById('history-count').textContent = `${filtered.length} prime${filtered.length > 1 ? 's' : ''}`
            const container = document.getElementById('member-history-list')
            container.innerHTML = ''
            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-zinc-400 text-center py-12">Aucune prime enregistrée pour le moment</p>`
                return
            }
            filtered.forEach(b => {
                const dateObj = new Date(b.date)
                const dateFr = dateObj.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })
                const row = document.createElement('div')
                row.className = 'flex justify-between items-center bg-zinc-800 rounded-2xl px-5 py-4'
                row.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="text-xl">${b.amount === 20 ? '⭐' : '🌟'}</span>
                        <div>
                            <p class="font-medium">${dateFr}</p>
                            <p class="text-xs text-zinc-400">${b.amount === 20 ? 'Prime 1' : 'Prime 2'}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="text-2xl font-semibold text-emerald-400">+${b.amount} €</span>
                        <button onclick="deleteBonus('${b.id}'); event.stopImmediatePropagation()" 
                                class="text-red-400 text-xl px-3">🗑</button>
                    </div>`
                container.appendChild(row)
            })
        }

        function deleteBonus(bonusId) {
            if (confirm('Supprimer cette prime ?')) {
                bonuses = bonuses.filter(b => b.id !== bonusId)
                saveData()
                renderMemberDetail(currentMemberId)
                renderMembersList()
            }
        }

        function renameCurrentMember() {
            const member = members.find(m => m.id === currentMemberId)
            if (!member) return
            const newName = prompt('Nouveau nom du membre :', member.name)
            if (newName && newName.trim() !== '') {
                member.name = newName.trim()
                saveData()
                renderMemberDetail(currentMemberId)
                renderMembersList()
            }
        }

        function deleteCurrentMember() {
            if (confirm('Voulez-vous vraiment supprimer ce membre et TOUTES ses primes ?')) {
                bonuses = bonuses.filter(b => b.memberId !== currentMemberId)
                members = members.filter(m => m.id !== currentMemberId)
                saveData()
                hideModal()
                renderMembersList()
            }
        }

        function showAddMemberModal() {
            if (members.length >= 30) {
                alert('Maximum 30 personnes atteint !')
                return
            }
            document.getElementById('new-member-name').value = ''
            document.getElementById('add-member-modal').classList.remove('hidden')
            document.getElementById('add-member-modal').classList.add('flex')
        }

        function addNewMember() {
            const nameInput = document.getElementById('new-member-name').value.trim()
            if (!nameInput) return alert('Veuillez entrer un nom')
            const newId = 'm-' + Date.now()
            members.push({ id: newId, name: nameInput })
            saveData()
            hideModal()
            renderMembersList()
        }

        function hideModal() {
            const modals = document.querySelectorAll('.fixed.inset-0')
            modals.forEach(modal => {
                modal.classList.add('hidden')
                modal.classList.remove('flex')
            })
            currentMemberId = null
        }

        function showHistory() {
            const container = document.getElementById('global-history-content')
            container.innerHTML = `<h4 class="font-medium mb-4">Toutes les primes par membre</h4>`
            members.forEach(member => {
                const memberBonuses = bonuses
                    .filter(b => b.memberId === member.id)
                    .sort((a, b) => new Date(b.date) - new Date(a.date))
                if (memberBonuses.length === 0) return
                let html = `
                <div class="mb-8">
                    <div class="flex justify-between mb-3">
                        <h5 class="font-semibold">${member.name}</h5>
                        <span class="text-emerald-400">${memberBonuses.reduce((s, b) => s + b.amount, 0)} € total</span>
                    </div>
                    <div class="space-y-2">`
                memberBonuses.slice(0, 8).forEach(b => {
                    const dateFr = new Date(b.date).toLocaleDateString('fr-FR')
                    html += `
                    <div class="flex justify-between text-sm bg-zinc-800/50 px-4 py-3 rounded-2xl">
                        <div>${dateFr} • ${b.amount === 20 ? 'Prime 1' : 'Prime 2'}</div>
                        <div class="font-semibold">+${b.amount} €</div>
                    </div>`
                })
                html += `</div></div>`
                container.innerHTML += html
            })
            if (bonuses.length === 0) {
                container.innerHTML += `<p class="text-center text-zinc-400 py-12">Aucune prime enregistrée pour l’instant</p>`
            }
            document.getElementById('history-modal').classList.remove('hidden')
            document.getElementById('history-modal').classList.add('flex')
        }

        function exportToCSV() {
            let csv = "Membre;Date;Type;Montant\n"
            bonuses.forEach(b => {
                const member = members.find(m => m.id === b.memberId)
                const type = b.amount === 20 ? 'Prime 1' : 'Prime 2'
                csv += `"${member ? member.name : 'Inconnu'}";${b.date};${type};${b.amount}\n`
            })
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' })
            const link = document.createElement('a')
            link.href = URL.createObjectURL(blob)
            link.download = `primes_equipe_${new Date().toISOString().slice(0,10)}.csv`
            link.click()
            hideModal()
        }

        function clearAllData() {
            if (confirm('⚠️ Supprimer TOUTES les données (membres + primes) ? Cette action est irréversible.')) {
                localStorage.removeItem('primesMembers')
                localStorage.removeItem('primesBonuses')
                members = []
                bonuses = []
                loadData()
                hideModal()
                renderMembersList()
                alert('✅ Toutes les données ont été effacées')
            }
        }

        function showSettings() {
            document.getElementById('settings-modal').classList.remove('hidden')
            document.getElementById('settings-modal').classList.add('flex')
        }

        function navigate(page) {
            if (page === 0) {
                renderMembersList()
            } else if (page === 1) {
                showHistory()
            } else if (page === 2) {
                showAddMemberModal()
            }
        }

        function launchApp() {
            loadData()
            renderMembersList()
            console.log('%c✅ App Primes Équipe chargée avec succès !', 'color:#10b981; font-family:monospace')
        }

        window.onload = launchApp
    </script>
</body>
</html>
